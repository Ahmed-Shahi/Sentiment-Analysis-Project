<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment AI | Prediction Tool</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Sentiment <span>Analysis</span></h1>
            <p class="subtitle">Analyze the emotional tone of your text instantly using NLP and machine learning.</p>
        </header>

        <main class="card">
            <div class="input-group">
                <label for="comment-input">Enter your comment</label>
                <textarea id="comment-input" placeholder="Type something like 'I love this project!' or 'This is terrible...'" rows="4"></textarea>
            </div>

            <button id="predict-btn" class="btn">
                <span class="btn-text">Analyze Sentiment</span>
                <div class="loader" id="loader"></div>
            </button>

            <div id="result-container" class="result-container hidden">
                <div class="divider"></div>
                <div class="result-content">
                    <p class="result-label">Detected Sentiment:</p>
                    <div id="sentiment-badge" class="sentiment-badge">
                        <span id="sentiment-text">Neutral</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
